<!-- Tactile Micro-Interactions & Audio/Haptic Simulation Script -->
<script>
  (function initTactilePuzzle() {
    const targetBlock = document.getElementById('target-block');
    const movesCounter = document.getElementById('moves-counter');
    const snoozeBtn = document.getElementById('snooze-btn');
    let moves = 0;
    let isDragging = false;
    let startX = 0;
    let currentX = 0;

    // Grab interaction on Target Block
    if (targetBlock) {
      const onStart = (clientX) => {
        isDragging = true;
        startX = clientX;
        targetBlock.style.boxShadow = '0 0 24px rgba(255, 87, 34, 0.85), inset 0 1px 0 rgba(255,255,255,0.5), 0 6px 14px rgba(0,0,0,0.6)';
        targetBlock.style.transform = 'scale(1.02)';
      };

      const onMove = (clientX) => {
        if (!isDragging) return;
        const deltaX = clientX - startX;
        // Limit resistance translation
        const clampedDelta = Math.max(-12, Math.min(32, deltaX));
        targetBlock.style.transform = `translateX(${clampedDelta}px) scale(1.02)`;
      };

      const onEnd = () => {
        if (!isDragging) return;
        isDragging = false;
        targetBlock.style.transform = '';
        targetBlock.style.boxShadow = '0 0 16px rgba(255,87,34,0.55), inset 0 1px 0 rgba(255,255,255,0.35), inset 0 -2px 0 rgba(0,0,0,0.4), 0 4px 8px rgba(0,0,0,0.5)';
        
        // Register move feedback
        moves += 1;
        if (movesCounter) {
          movesCounter.textContent = moves < 10 ? '0' + moves : moves;
        }
      };

      // Pointer event integration for smooth cross-device interaction
      targetBlock.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        onStart(e.clientX);
        const handlePointerMove = (ev) => onMove(ev.clientX);
        const handlePointerUp = () => {
          onEnd();
          window.removeEventListener('pointermove', handlePointerMove);
          window.removeEventListener('pointerup', handlePointerUp);
        };
        window.addEventListener('pointermove', handlePointerMove);
        window.addEventListener('pointerup', handlePointerUp);
      });
    }

    // Snooze micro-feedback
    if (snoozeBtn) {
      snoozeBtn.addEventListener('click', () => {
        snoozeBtn.style.transform = 'scale(0.96)';
        setTimeout(() => {
          snoozeBtn.style.transform = '';
        }, 120);
      });
    }
  })();
</script></main><footer class="fixed bottom-0 inset-x-0 z-50 pointer-events-none pb-safe"><div class="h-8 w-full flex items-center justify-center"><div class="w-32 h-1 rounded-full bg-secondary-container/80"></div></div></footer></body></html>
